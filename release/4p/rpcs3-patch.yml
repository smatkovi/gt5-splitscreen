  "GT5 3P/4P: MController key config for pads 3 and 4":
    Games:
      "Gran Turismo 5":
        BCES00569: [ 02.17 ]
    Author: "gt5re"
    Notes: "gtengine::MController kept only two static per-port handles (0x17fdf70) and its getter 0x48a8f4 returned NULL for port > 1, so pads 3/4 were polled but never mapped to accelerate/brake/steer. Two more handles + config vectors live in the RW segment tail (0x1948600), built by a static-ctor cave (0x1581140, hook 0x48aba8); the getter moved to cave 0x1581100 and accepts ports 0..3. Needs the script mod (declare + setConfig for ports 2/3)."
    Patch Version: 1.0
